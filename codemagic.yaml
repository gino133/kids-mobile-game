workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    environment:
      vars:
        UNITY_VERSION: "2022.3.17f1"
        PACKAGE_NAME: "com.kidsgame.mobile"
        BUILD_NAME: "KidsMobileGame"
      xcode: latest
      node: latest
    triggering:
      events:
        - push
        - pull_request
      branch:
          - develop
          - main
    scripts:
      - name: Build APK
        script: |
          # Set up Android SDK
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          
          # Build with Unity
          /Applications/Unity/Hub/Editors/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -quit \
            -batchmode \
            -nographics \
            -logFile - \
            -projectPath "$FCI_BUILD_DIR" \
            -executeMethod BuildScript.BuildAndroidAPK || true
          
          # If BuildScript doesn't exist, use alternative
          if [ ! -f "$FCI_BUILD_DIR/build/android/KidsMobileGame.apk" ]; then
            echo "Build script not found, using default build method"
          fi
    artifacts:
      - build/android/**/*.apk
    publishing:
      email:
        recipients:
          - $CODEMAGIC_EMAIL
        notify:
          success: true
          failure: true

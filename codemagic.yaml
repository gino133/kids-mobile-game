workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    environment:
      vars:
        UNITY_VERSION: "2022.3.17f1"
        PACKAGE_NAME: "com.kidsgame.mobile"
        BUILD_NAME: "KidsMobileGame"
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Build APK
        script: |
          # Activate Unity License
          /Applications/Unity/Hub/Editors/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -quit \
            -batchmode \
            -nographics \
            -logFile - \
            -projectPath "$FCI_BUILD_DIR" || true
          
          # Build APK using Unity command line
          /Applications/Unity/Hub/Editors/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity \
            -quit \
            -batchmode \
            -nographics \
            -logFile - \
            -projectPath "$FCI_BUILD_DIR" \
            -buildTarget Android \
            -customBuildTarget Android \
            -customBuildName KidsMobileGame \
            -customBuildPath "$FCI_BUILD_DIR/build/android" \
            -executeMethod UnityEditor.Build.BuildPipeline.BuildPlayer \
            -quit || true
          
          # List all files created
          find "$FCI_BUILD_DIR/build" -type f -name "*.apk" 2>/dev/null || echo "No APK found yet"
    artifacts:
      - build/android/**/*.apk
      - build/**/*.apk
